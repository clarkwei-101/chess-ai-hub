# KataGo GTP config for Chess AI Hub
# NOTE: `-model <abs_path>` must be passed via CLI, config key is ignored by KataGo v1.18.1.

# === I/O ===
logDir = /Users/yahweh/Desktop/ai应用社/chess-ai-hub/engines/logs
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false
ogsChatToStderr = false
startupPrintMessageToStderr = true

# === Neural net cache ===
nnRandomize = true
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

# === Search (CHESS-AI-HUB: stronger defaults) ===
# 1600 visits ≈ 5-10s on Mac Studio M2 Ultra; raise to 8000 for serious play
maxVisits = 8000
# maxTime = 0 disables the time cap so KataGo uses all available visits.
# The HTTP wrapper (/api/go-ai-server) sets time per-move instead.
maxTime = 0
numSearchThreads = 8
lagBuffer = 1.0

# === Analysis ===
analysisPVLen = 12
reportAnalysisWinratesAs = SIDETOMOVE

# === Rules (Tromp-Taylor via individual keys) ===
koRule = POSITIONAL
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = true
hasButton = false
friendlyPassOk = false
whiteHandicapBonus = 0

# === Resignation ===
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3

# === Misc ===
ponderingEnabled = false
rootSymmetryPruning = true
antiMirror = true
enablePassingHacks = true
useEvalCache = false