# KataGo GTP config for Chess AI Hub
# NOTE: `-model <abs_path>` must be passed via CLI, config key is ignored by KataGo v1.18.1.

# === I/O ===
logDir = /Users/yahweh/Desktop/ai应用社/chess-ai-hub/engines/logs
logAllGTPCommunication = false
# logSearchInfo enables KataGo to emit 'info ...' lines through GTP.
# This is the DATA that kata-analyze streams back — MUST be true.
logSearchInfo = true
logSearchInfoForChosenMove = false
logToStderr = false
ogsChatToStderr = false
startupPrintMessageToStderr = true

# === Neural net cache ===
nnRandomize = true
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

# === Search (CHESS-AI-HUB: stronger defaults) ===
# SSE kata-analyze 期望引擎持续 emit info 直到外部 stop (空行 / 新命令)。
# KataGo v1.18.1 在 visits 高时 emit 间隔指数级增长 (issue #155),无论 maxVisits 多大,
# interval 1000cs (10s) 实际上 8 秒内只 emit 1 次,然后停止。
# 因此 maxVisits 设小 (5000) 让 KataGo 完成搜索 ~3 秒后 emit final,SSE 流自然结束。
# intervalCs=10 (0.1s, JavaScript 端设) 强迫 KataGo 在低 visits 时频繁 emit。
# maxTime = 0 不限时间,因为 KataGo 默认在 maxVisits 达到后结束 search。
maxVisits = 5000
maxTime = 0
numSearchThreads = 8
lagBuffer = 1.0

# === Analysis ===
analysisPVLen = 12
reportAnalysisWinratesAs = SIDETOMOVE

# === Rules (Tromp-Taylor via individual keys) ===
koRule = POSITIONAL
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = true
hasButton = false
friendlyPassOk = false
whiteHandicapBonus = 0

# === Resignation ===
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3

# === Misc ===
ponderingEnabled = false
rootSymmetryPruning = true
antiMirror = true
enablePassingHacks = true
useEvalCache = false