<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess AI Hub</title>
  <style>
    body {
      width: 320px;
      min-height: 200px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0F0F14 0%, #1A1A2E 100%);
      color: #fff;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #818CF8;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #aaa;
      margin: 8px 0;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 12px;
    }
    .status-ok {
      color: #10B981;
    }
    .status-error {
      color: #EF4444;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <h1>Chess AI Hub Assistant</h1>
  <p>Real-time AI analysis for Lichess and Chess.com</p>
  
  <div class="status" id="status">
    <div>Checking connection...</div>
  </div>
  
  <button id="openApp">Open Local App</button>
  
  <script src="popup.js"></script>
</body>
</html>
